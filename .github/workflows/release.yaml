name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Import Apple code signing cert
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.P12_PASSWORD }}

      - name: Build mac XPL plugin
        run: |
          make mac VERSION=${GITHUB_REF##*/}

      - name: Sign mac XPL plugin and SkyScript library
        run: |
          codesign --force --timestamp --options runtime \
            --sign "${{ secrets.CODESIGN_IDENTITY }}" \
            build/zoal-honeycomb/libSkyScriptLib-zoal-honeycomb.dylib \
            build/zoal-honeycomb/mac.xpl

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-mac
          path: build/zoal-honeycomb/

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          path-type: inherit
          update: true
          install: >-
            make
            unzip
            mingw-w64-x86_64-toolchain

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build Windows XPL plugin
        shell: msys2 {0}
        run: |
          make win VERSION=${GITHUB_REF##*/}

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-windows
          path: build/zoal-honeycomb/

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc libudev-dev patchelf

      - name: Build Linux XPL plugin
        run: |
          make lin VERSION=${GITHUB_REF##*/}
          readelf -d build/zoal-honeycomb/lin.xpl | grep -E "NEEDED|RUNPATH|RPATH"

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-linux
          path: build/zoal-honeycomb/

  release:
    needs: [build-mac, build-windows, build-linux]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check generated frontend models
        run: go test ./cmd/gen-ts-models

      - name: Download platform builds
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Assemble release package
        run: |
          TAG=${GITHUB_REF##*/}

          # Configurator UI and shipped profiles
          make package

          # Plugins and their SkyScript libraries
          cp artifacts/build-mac/* artifacts/build-windows/* artifacts/build-linux/* build/zoal-honeycomb/

          # Updater config
          cp skunkcrafts_updater.cfg build/zoal-honeycomb/
          sed -i '' "s/REPLACE_ME/${TAG}/g" build/zoal-honeycomb/skunkcrafts_updater.cfg
          printf '%s\n' "${TAG}" > build/zoal-honeycomb/${TAG}

          ls -la build/zoal-honeycomb

      - name: Notarize release zip
        run: |
          root=$(pwd)
          cd build && \
            ditto -c -k --sequesterRsrc --keepParent zoal-honeycomb zoal-honeycomb.zip && \
            cd $root

          xcrun notarytool submit build/zoal-honeycomb.zip \
            --apple-id "${{ secrets.APPLE_ID }}" \
            --password "${{ secrets.MAC_DEV_PASSWORD }}" \
            --team-id "${{ secrets.APPLE_TEAMID }}" \
            --wait

      - name: Generate release notes
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          bash scripts/generate-release-notes.sh "${{ runner.temp }}/release-notes.md" "${GITHUB_REF##*/}"

      - name: Prepare release branch and checksums
        run: |
          cp -r build/zoal-honeycomb/ release/

          # Create CRC32 checksums
          rm -f release/skunkcrafts_updater_whitelist.txt
          find release -type f ! \( -name '*skunkcrafts_updater*' -o -path '*skunkcrafts_updater*' \) -print0 | while IFS= read -r -d '' file; do
            checksum_hex=$(crc32 "$file")
            checksum_decimal=$((16#$checksum_hex))
            modified_file="${file#release/}"
            echo "$modified_file|$checksum_decimal" >> release/skunkcrafts_updater_whitelist.txt
          done
          touch release/skunkcrafts_updater_blacklist.txt

          TAG=${GITHUB_REF##*/}
          TARGET_BRANCH="release"
          git checkout -b ${TARGET_BRANCH}
          git add .
          git commit -m "new ${TARGET_BRANCH} - ${TAG}"
          git push -f -u origin ${TARGET_BRANCH}

      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          body_path: ${{ runner.temp }}/release-notes.md
          files: |
            ${{ github.workspace }}/build/zoal-honeycomb.zip
          prerelease: ${{ contains(github.ref_name, '-') }}
